{% extends 'base.html' %}

{% block content %}
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 class="mb-3">{{ titulo }}</h2>
            <p>¿Estás seguro de que deseas eliminar la venta de <strong>{{ objeto.producto }}</strong> a <strong>{{ objeto.cliente }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'semana4:listado_ventas' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
{% endblock %}
